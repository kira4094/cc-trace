<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cc-trace</title>
<style>
  :root { --bg: #F6F6F1; --surface: #FFFFFF; --border: #E5E5E0; --text: #111827; --text-dim: #6B7280; --accent: #FF5701; --green: #16A34A; --hover: #F3F3EE; --active-bg: #FFF0E8; --badge-bg: #F0F0EB; --shadow: rgba(0,0,0,0.04); --search-bg: #FFFFFF; --toolbar-bg: #FFFFFF; }
  [data-theme="dark"] { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff; --green: #3fb950; --hover: rgba(255,255,255,0.04); --active-bg: rgba(88,166,255,0.1); --badge-bg: rgba(255,255,255,0.05); --shadow: rgba(0,0,0,0.2); --search-bg: #0d1117; --toolbar-bg: #161b22; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 12px; }
  .topbar h1 { font-size: 16px; font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .body { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 340px; min-width: 340px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .main { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .bottombar { display: flex; align-items: center; padding: 4px 20px; background: var(--surface); border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); }
  .proj-group { border-bottom: 1px solid var(--border); }
  .proj-header { display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer; user-select: none; }
  .proj-header:hover { background: var(--hover); }
  .proj-header .arrow { font-size: 10px; transition: transform 0.15s; }
  .proj-header .arrow.open { transform: rotate(90deg); }
  .session-item { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 28px; cursor: pointer; border-left: 2px solid transparent; font-size: 13px; }
  .session-item:hover { background: var(--hover); }
  .session-item.active { background: var(--active-bg); border-left-color: var(--accent); }
  .session-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .date { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .session-item .count { font-size: 11px; color: var(--text-dim); background: var(--badge-bg); padding: 1px 6px; border-radius: 8px; }
  .search-box { display: flex; gap: 4px; align-items: center; }
  .search-box input { width: 120px; height: 28px; background: var(--search-bg); border: 1px solid var(--border); color: var(--text); padding: 0 8px; border-radius: 4px; font-size: 12px; box-sizing: border-box; }
  .search-box input:focus { outline: none; border-color: var(--accent); }
  .search-box button { background: var(--accent); color: #fff; border: none; height: 28px; padding: 0 10px; border-radius: 4px; cursor: pointer; font-size: 12px; box-sizing: border-box; }
  .theme-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); height: 28px; width: 30px; padding: 0; border-radius: 4px; cursor: pointer; font-size: 14px; line-height: 28px; text-align: center; box-sizing: border-box; }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty h2 { font-size: 18px; margin-bottom: 6px; }
  .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  .record { padding: 10px 14px; margin-bottom: 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; box-shadow: 0 1px 2px var(--shadow); }
  .record.tool_use { border-left: 3px solid #D97706; }
  .record.user_message { border-left: 3px solid var(--accent); }
  .record.assistant_message { border-left: 3px solid var(--green); }
  .record .meta { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
  .record .content { white-space: pre-wrap; word-break: break-word; }
  .main-header { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .main-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
</style>
</head>
<body>
<div class="topbar">
  <h1>🔍 cc-trace</h1>
  <div class="spacer"></div>
  <div class="search-box">
    <input id="search-input" placeholder="Search..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">Go</button>
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☽</button>
  </div>
</div>
<div class="body">
  <div class="sidebar">
    <div style="padding:8px 14px;border-bottom:1px solid var(--border)">
      <select id="project-select" style="width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);padding:5px 8px;border-radius:4px;font-size:13px;cursor:pointer">
        <option value="">All projects</option>
      </select>
    </div>
    <div id="sidebar" style="overflow-y:auto;flex:1"><div class="loading">Loading...</div></div>
  </div>
  <div class="main" id="main"><div class="empty"><h2>Select a session</h2></div></div>
</div>
<div class="bottombar">
  <span id="status">—</span>
</div>
<script>
const API = '';
let data = []; let currentSid = null; let currentDate = null; let activeSessionId = null; let expandedGid = '';

async function fetch_(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

async function updateStatus() {
  try {
    const s = await fetch_('/api/status');
    document.getElementById('status').innerHTML = '<span style="color:var(--accent);font-weight:600">cc-trace</span> ' + s.sessionCount + ' sessions · ' + s.memoryCount + ' memories';
  } catch {}
}

async function loadSessions() {
  document.getElementById('sidebar').innerHTML = '<div class="loading">Loading...</div>';
  try {
    data = await fetch_('/api/sessions');
    renderSidebar();
  } catch (e) {
    document.getElementById('sidebar').innerHTML = '<div class="empty"><h2>Error</h2><p>' + e.message + '</p></div>';
  }
}

function populateProjects(allData) {
  const sel = document.getElementById('project-select');
  const projects = new Set();
  for (const g of allData) {
    for (const s of g.sessions) {
      if (s.workspace) {
        const name = s.workspace.replace(/\\/g, '/').split('/').pop();
        projects.add(name);
      }
    }
  }
  const cur = sel.value;
  sel.innerHTML = '<option value="">All projects</option>';
  for (const p of [...projects].sort()) {
    sel.innerHTML += '<option value="' + p + '">' + p + '</option>';
  }
  if (cur) sel.value = cur;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  populateProjects(data);
  const selProj = document.getElementById('project-select').value;
  const all = [];
  for (const g of data) {
    for (const s of g.sessions) {
      if (selProj) {
        const name = (s.workspace || '').replace(/\\/g, '/').split('/').pop() || '';
        if (name !== selProj) continue;
      }
      all.push(s);
    }
  }
  const byTitle = {};
  for (const s of all) {
    const key = s.title || s.sessionId.slice(0, 16);
    if (!byTitle[key]) byTitle[key] = { title: key, sessions: [] };
    byTitle[key].sessions.push(s);
  }
  const keys = Object.keys(byTitle);
  if (keys.length === 0) { sb.innerHTML = '<div class="empty" style="padding:30px"><h2>No sessions</h2></div>'; return; }
  // Find the latest date for active session across ALL data (global)
  let latestDate = '', latestKey = '';
  let globalLatestDate = '';
  // First pass: find the absolute latest date for this session across all projects
  for (const g of data) {
    for (const s of g.sessions) {
      if (s.sessionId === activeSessionId && s.date > globalLatestDate) {
        globalLatestDate = s.date;
      }
    }
  }
  // Second pass: find matching group (only if the global latest date falls in current filter)
  for (const key of keys) {
    for (const s of byTitle[key].sessions) {
      if (s.sessionId === activeSessionId && s.date === globalLatestDate) {
        latestDate = s.date; latestKey = key;
      }
    }
  }
  let html = '', idx = 0;
  for (const key of keys) {
    const g = byTitle[key];
    const gid = 'g' + (idx++);
    const sessions = g.sessions.sort((a, b) => b.date.localeCompare(a.date));
    const isActive = key === latestKey;
    const open = gid === expandedGid || (!expandedGid && isActive);
    html += '<div class="proj-group" data-gid="' + gid + '"><div class="proj-header" onclick="toggleProj(\'' + gid + '\')"><span class="arrow ' + (open?'open':'') + '">▶</span> ' + esc(g.title) + ' <span style="margin-left:auto;font-weight:400">' + sessions.length + '</span></div><div class="proj-sessions" id="proj-' + gid + '" style="display:' + (open?'block':'none') + '">';
    for (const s of sessions) {
      const isCur = s.sessionId === activeSessionId && s.date === latestDate;
      const act = currentSid === s.sessionId && currentDate === s.date;
      const dot = isCur ? '<span style="color:var(--green)">🟢</span> ' : '';
      html += '<div class="session-item' + (act ? ' active' : '') + '" onclick="selectSession(\'' + s.date + '\',\'' + s.sessionId + '\')" data-date="' + s.date + '" data-sid="' + s.sessionId + '"><span class="title" style="padding-left:16px">' + dot + s.date + '</span><span class="count">' + s.recordCount + '</span></div>';
    }
    html += '</div></div>';
  }
  sb.innerHTML = html;
}

function toggleProj(id) {
  const el = document.getElementById('proj-' + id);
  if (!el) return;
  const wasHidden = el.style.display === 'none';
  // Collapse all other groups, expand this one
  document.querySelectorAll('.proj-sessions').forEach(e => { e.style.display = 'none'; });
  document.querySelectorAll('.arrow').forEach(a => a.classList.remove('open'));
  el.style.display = 'block';
  const arrow = el.parentElement.querySelector('.arrow');
  if (arrow) arrow.classList.add('open');
  expandedGid = id;
}

function selectDate(date) {
  currentDate = date; currentSid = null;
  document.getElementById('main').innerHTML = '<div class="empty"><h2>Select a session</h2></div>';
  renderSidebar();
}

function projFromWs(ws) {
  if (!ws) return 'default';
  const parts = ws.replace(/\\/g, '/').split('/').filter(Boolean);
  return parts[parts.length - 1] || 'default';
}

async function selectSession(date, sid) {
  currentDate = date; currentSid = sid;
  const dateEl = document.querySelector('[data-sid="' + sid + '"]');
  if (dateEl) {
    const pg = dateEl.closest('.proj-group');
    if (pg) expandedGid = pg.getAttribute('data-gid') || '';
  }
  renderSidebar();
  document.getElementById('main').innerHTML = '<div class="loading">Loading records...</div>';
  try {
    // Find the workspace from data to derive project folder name
    let ws = null;
    for (const g of data) {
      for (const s of g.sessions) {
        if (s.sessionId === sid) { ws = s.workspace; break; }
      }
      if (ws) break;
    }
    const proj = projFromWs(ws);
    const d = await fetch_('/api/sessions/' + proj + '/' + sid + '?date=' + currentDate);
    renderRecords(d);
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="empty"><h2>Error</h2><p>' + e.message + '</p></div>';
  }
}

const TOOL_COLORS = {
  Bash: '#D97706', Read: '#FF5701', Write: '#16A34A', Edit: '#16A34A',
  WebSearch: '#A855F7', WebFetch: '#A855F7', Grep: '#F97316', Glob: '#F97316',
  default: '#8B949E'
};

function renderRecords(d) {
  const main = document.getElementById('main');
  if (!d || !d.records || d.records.length === 0) { main.innerHTML = '<div class="empty"><h2>No records</h2></div>'; return; }
  const title = (d.records.find(r => r.type === 'user_message')?.content || d.sessionId).slice(0, 60).replace(/\n/g, ' ');
  let html = '<div class="main-header">' + esc(title) + '</div><div class="main-meta">' + d.total + ' records</div>';

  let i = 0;
  while (i < d.records.length) {
    const r = d.records[i];
    const type = r.type || 'unknown';
    const time = r.ts ? new Date(r.ts).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '';

    if (type === 'tool_use') {
      // Group consecutive tool_use records
      const group = [];
      while (i < d.records.length && d.records[i].type === 'tool_use') {
        group.push(d.records[i]);
        i++;
      }
      // Count by tool name
      const counts = {};
      const names = [];
      for (const t of group) {
        const n = t.toolName || 'unknown';
        if (!counts[n]) { counts[n] = 0; names.push(n); }
        counts[n]++;
      }
      const tools = names.map(n => {
        const c = TOOL_COLORS[n] || TOOL_COLORS.default;
        const label = counts[n] > 1 ? n + '(' + counts[n] + ')' : n;
        return '<span style="color:' + c + ';font-weight:600">' + label + '</span>';
      });
      const ts = group[0].ts;
      const grpTime = ts ? new Date(ts).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '';
      html += '<div class="record tool_use"><div class="meta">' + grpTime + ' · ' + tools.join(' ') + '</div></div>';
    } else {
      html += '<div class="record ' + type + '"><div class="meta">' + time + ' · ' + type;
      if (r.toolName) {
        const c = TOOL_COLORS[r.toolName] || TOOL_COLORS.default;
        html += ' · <span style="color:' + c + ';font-weight:600">' + esc(r.toolName) + '</span>';
      }
      html += '</div>';
      if (r.content) html += '<div class="content">' + esc(r.content.slice(0,2000)) + '</div>';
      html += '</div>';
      i++;
    }
  }
  main.innerHTML = html;
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  document.getElementById('main').innerHTML = '<div class="loading">Searching...</div>';
  try {
    const r = await fetch_('/api/search?q=' + encodeURIComponent(q));
    const items = r.keyword || r.ai_fallback || [];
    if (!items || items.length === 0) { document.getElementById('main').innerHTML = '<div class="empty"><h2>No results</h2></div>'; return; }
    let html = '<div class="main-header">Results</div><div class="main-meta">' + items.length + ' matches</div>';
    for (const item of items) {
      const content = item.record?.content || item.content || '';
      html += '<div class="record"><div class="meta">[' + (item.date || '?') + ']</div><div class="content">' + esc(String(content).slice(0,500)) + '</div></div>';
    }
    document.getElementById('main').innerHTML = html;
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="empty"><h2>Search failed</h2></div>';
  }
}

async function fetchActiveSession() {
  try {
    const r = await fetch_('/api/current-session');
    if (r.sessionId) activeSessionId = r.sessionId;
  } catch {}
}

function toggleTheme() {
  const isDark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', isDark ? '' : 'dark');
  document.getElementById('theme-btn').textContent = isDark ? '☽' : '☀';
  try { localStorage.setItem('cc-trace-theme', isDark ? 'light' : 'dark'); } catch {}
}
// Restore saved theme
try {
  const saved = localStorage.getItem('cc-trace-theme');
  if (saved === 'dark') { document.body.setAttribute('data-theme', 'dark'); document.getElementById('theme-btn').textContent = '☀'; }
} catch {}

document.getElementById('project-select').addEventListener('change', function() {
  currentSid = null;
  renderSidebar();
  document.getElementById('main').innerHTML = '<div class="empty"><h2>Select a session</h2></div>';
});

updateStatus();
setInterval(updateStatus, 10000);
fetchActiveSession();
setInterval(fetchActiveSession, 5000);
loadSessions().then(() => {
  if (activeSessionId && !currentSid) {
    let latestDate = '';
    for (const g of data) {
      for (const s of g.sessions) {
        if (s.sessionId === activeSessionId && s.date > latestDate) latestDate = s.date;
      }
    }
    if (latestDate) selectSession(latestDate, activeSessionId);
  }
});
</script>
</body>
</html>
