<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cc-trace - Memory Browser</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --orange: #d29922;
    --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; font-size: 14px;
  }
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center; gap: 16px;
    position: sticky; top: 0; z-index: 100;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .status { font-size: 12px; color: var(--text-dim); margin-left: auto; text-align: right; }
  .search-bar {
    display: flex; gap: 8px; padding: 12px 24px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .search-bar input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px;
  }
  .search-bar input:focus { outline: none; border-color: var(--accent); }
  .search-bar button {
    background: var(--accent); color: #fff; border: none;
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .search-bar button:hover { opacity: 0.9; }
  .container { display: flex; height: calc(100vh - 110px); }
  .sidebar {
    width: 320px; min-width: 320px; background: var(--surface);
    border-right: 1px solid var(--border); overflow-y: auto;
  }
  .main {
    flex: 1; overflow-y: auto; padding: 16px 24px;
  }
  .sidebar-section {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .sidebar-section h3 {
    font-size: 12px; text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 8px; letter-spacing: 0.5px;
  }
  .session-item {
    padding: 8px 12px; border-radius: 6px; cursor: pointer;
    margin-bottom: 2px; font-size: 13px;
  }
  .session-item:hover { background: rgba(255,255,255,0.05); }
  .session-item.active { background: rgba(88,166,255,0.15); color: var(--accent); }
  .session-item .date { color: var(--text-dim); font-size: 11px; }
  .session-item .count { color: var(--text-dim); font-size: 11px; float: right; }
  .date-group { margin-bottom: 4px; }
  .date-group .date-label {
    font-size: 11px; color: var(--text-dim); padding: 4px 12px 2px;
    font-weight: 600; letter-spacing: 0.3px;
  }
  .record {
    padding: 12px 16px; margin-bottom: 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 13px; line-height: 1.6;
  }
  .record.tool_use { border-left: 3px solid var(--orange); }
  .record.user_message { border-left: 3px solid var(--accent); }
  .record.assistant_message { border-left: 3px solid var(--green); }
  .record .meta { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .record .content { white-space: pre-wrap; word-break: break-word; }
  .record .tool-name { color: var(--orange); font-weight: 600; }
  .record code {
    background: rgba(255,255,255,0.05); padding: 1px 4px;
    border-radius: 3px; font-size: 12px;
  }
  .record .collapsed { max-height: 200px; overflow: hidden; position: relative; }
  .record .collapsed::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 40px; background: linear-gradient(transparent, var(--surface));
  }
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-dim);
  }
  .empty-state h2 { font-size: 20px; margin-bottom: 8px; }
  .memory-entry {
    padding: 8px 12px; border-radius: 6px; margin-bottom: 2px;
    font-size: 13px; border-left: 2px solid var(--green);
  }
  .search-results { padding: 16px; }
  .search-result-item {
    padding: 12px; margin-bottom: 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .search-result-item .match { color: var(--accent); font-weight: 600; }
  .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  .error-msg { color: var(--red); padding: 16px; }
  .memory-tab { padding: 16px; }
  .tab-bar {
    display: flex; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .tab {
    padding: 10px 20px; cursor: pointer; font-size: 13px; color: var(--text-dim);
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .record-count { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div class="header">
  <h1>🔍 cc-trace</h1>
  <span id="status-text" class="status">connecting...</span>
</div>
<div class="tab-bar">
  <div class="tab active" onclick="switchTab('sessions')">Sessions</div>
  <div class="tab" onclick="switchTab('memory')">Memory</div>
  <div class="tab" onclick="switchTab('search')">Search</div>
</div>
<div class="search-bar" id="search-bar">
  <input type="text" id="search-input" placeholder="Search conversations..." onkeydown="if(event.key==='Enter')doSearch()">
  <button onclick="doSearch()">Search</button>
</div>
<div class="container">
  <div class="sidebar" id="sidebar">
    <div class="loading">Loading sessions...</div>
  </div>
  <div class="main" id="main-content">
    <div class="empty-state">
      <h2>Select a session</h2>
      <p>Choose a session from the left to view its records</p>
    </div>
  </div>
</div>
<script>
const API = '';
let sessionsData = [];
let currentTab = 'sessions';

function $(id) { return document.getElementById(id); }

async function api(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── Status ──────────────────────────────────────────────
async function updateStatus() {
  try {
    const s = await api('/api/status');
    $('status-text').textContent =
      `Uptime: ${Math.floor(s.uptime / 60)}m · Sessions: ${s.sessionCount} · Memory: ${s.memoryCount}`;
  } catch {
    $('status-text').textContent = 'Server not reachable';
  }
}

// ── Sessions ────────────────────────────────────────────
async function loadSessions() {
  $('sidebar').innerHTML = '<div class="loading">Loading sessions...</div>';
  try {
    sessionsData = await api('/api/sessions');
    renderSidebar();
  } catch (e) {
    $('sidebar').innerHTML = `<div class="error-msg">Failed to load: ${e.message}</div>`;
  }
}

function renderSidebar() {
  if (!sessionsData || sessionsData.length === 0) {
    $('sidebar').innerHTML = '<div class="empty-state" style="padding:20px">No sessions yet</div>';
    return;
  }
  let html = '';
  for (const group of sessionsData) {
    html += `<div class="date-group"><div class="date-label">${group.date}</div>`;
    for (const s of group.sessions) {
      html += `<div class="session-item" onclick="loadSession('${group.date}','${s.sessionId}')" data-date="${group.date}" data-sid="${s.sessionId}">
        <span>${s.sessionId.slice(0, 20)}</span>
        <span class="count">${s.recordCount} records</span>
        <div class="date">${group.date}</div>
      </div>`;
    }
    html += '</div>';
  }
  $('sidebar').innerHTML = html;
}

async function loadSession(date, sessionId) {
  // Highlight active
  document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
  const sel = document.querySelector(`.session-item[data-date="${date}"][data-sid="${sessionId}"]`);
  if (sel) sel.classList.add('active');

  $('main-content').innerHTML = '<div class="loading">Loading records...</div>';
  try {
    const data = await api(`/api/sessions/${date}/${sessionId}`);
    renderRecords(data);
  } catch (e) {
    $('main-content').innerHTML = `<div class="error-msg">${e.message}</div>`;
  }
}

function renderRecords(data) {
  if (!data || !data.records || data.records.length === 0) {
    $('main-content').innerHTML = '<div class="empty-state"><h2>No records</h2></div>';
    return;
  }
  let html = `<div class="record-count">${data.total} records</div>`;
  for (const r of data.records) {
    const type = r.type || 'unknown';
    const time = r.ts ? new Date(r.ts).toLocaleTimeString() : '';
    html += `<div class="record ${type}">`;
    html += `<div class="meta">${time} · ${type}`;
    if (r.toolName) html += ` · <span class="tool-name">${r.toolName}</span>`;
    html += '</div>';
    if (r.content) {
      const content = escapeHtml(r.content);
      const cls = r.content.length > 500 ? 'content collapsed' : 'content';
      html += `<div class="${cls}">${content}</div>`;
      if (r.content.length > 500) {
        html += `<div style="color:var(--accent);cursor:pointer;font-size:12px;margin-top:4px" onclick="this.previousElementSibling.classList.toggle('collapsed');this.textContent=this.previousElementSibling.classList.contains('collapsed')?'Show more':'Show less'">Show more</div>`;
      }
    }
    if (r.toolInput) html += `<div class="content" style="color:var(--text-dim);margin-top:4px;font-size:12px">Input: ${escapeHtml(r.toolInput.slice(0, 300))}</div>`;
    if (r.toolResult) html += `<div class="content" style="color:var(--text-dim);margin-top:4px;font-size:12px">Result: ${escapeHtml(r.toolResult.slice(0, 300))}</div>`;
    html += '</div>';
  }
  $('main-content').innerHTML = html;
}

// ── Memory ──────────────────────────────────────────────
async function loadMemory() {
  $('main-content').innerHTML = '<div class="loading">Loading memory...</div>';
  try {
    const entries = await api('/api/memory');
    if (!entries || entries.length === 0) {
      $('main-content').innerHTML = '<div class="empty-state"><h2>No memory entries</h2><p>Summaries will appear here after sessions end</p></div>';
      return;
    }
    let html = `<div class="record-count">${entries.length} memory entries</div>`;
    for (const e of entries) {
      html += `<div class="memory-entry">${escapeHtml(e.text || '')}</div>`;
    }
    $('main-content').innerHTML = html;
  } catch (e) {
    $('main-content').innerHTML = `<div class="error-msg">${e.message}</div>`;
  }
}

// ── Search ──────────────────────────────────────────────
async function doSearch() {
  const q = $('search-input').value.trim();
  if (!q) return;
  switchTab('search');
  $('main-content').innerHTML = '<div class="loading">Searching...</div>';
  try {
    const results = await api(`/api/search?q=${encodeURIComponent(q)}`);
    renderSearchResults(results, q);
  } catch (e) {
    $('main-content').innerHTML = `<div class="error-msg">Search failed: ${e.message}</div>`;
  }
}

function renderSearchResults(results, query) {
  if (!results || (Array.isArray(results) && results.length === 0)) {
    $('main-content').innerHTML = `<div class="empty-state"><h2>No results for "${query}"</h2></div>`;
    return;
  }
  let html = `<div class="record-count">Results for: "${query}"</div>`;
  // Handle dual output (keyword + ai_fallback)
  const items = results.keyword || results.ai_fallback || results;
  if (Array.isArray(items)) {
    for (const item of items) {
      const sessionId = item.sessionId || item._sessionId || '?';
      const date = item.date || item._date || '?';
      const content = item.record?.content || item.content || item.text || '';
      const type = item.record?.type || item.type || 'match';
      html += `<div class="search-result-item">
        <div class="meta">[${date}/${sessionId}] · ${type}</div>
        <div class="content">${escapeHtml(String(content).slice(0, 500))}</div>
      </div>`;
    }
  }
  if (results.note) {
    html += `<div style="color:var(--orange);padding:8px;font-size:12px">${results.note}</div>`;
  }
  $('main-content').innerHTML = html;
}

// ── Tabs ────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab')[tab === 'sessions' ? 0 : tab === 'memory' ? 1 : 2].classList.add('active');
  $('search-bar').style.display = tab === 'search' ? 'flex' : 'none';
  if (tab === 'sessions') { loadSessions(); }
  else if (tab === 'memory') { loadMemory(); }
  else if (tab === 'search') {
    const q = $('search-input').value.trim();
    if (q) doSearch();
    else $('main-content').innerHTML = '<div class="empty-state"><h2>Search sessions</h2><p>Type a query above to search past conversations</p></div>';
  }
}

// ── Utils ───────────────────────────────────────────────
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ────────────────────────────────────────────────
updateStatus();
setInterval(updateStatus, 10000);
loadSessions();
</script>
</body>
</html>
