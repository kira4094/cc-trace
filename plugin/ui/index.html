<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cc-trace</title>
<style>
  /* ===== Design Tokens ===== */
  :root {
    --bg: #eef0f4;
    --surface: #f0f2f5;
    --surface-light: #f8f9fc;
    --text-primary: #1e1e2a;
    --text-secondary: #5a5d6e;
    --text-tertiary: #9397ad;
    --accent: #FF5701;
    --accent-soft: #ff7a2e;
    --accent-glow: rgba(255,87,1,0.15);
    --green: #16A34A;
    --danger: #DC2626;
    --border: #d0d3dc;
    --shadow-dark: #c4c8d2;
    --shadow-light: #ffffff;
    --shadow-depth: 0 12px 40px rgba(0,0,0,0.06);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --transition: 0.25s var(--ease-out);
  }
  [data-theme="dark"] {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-light: #1c2333;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-tertiary: #6e7681;
    --accent: #58a6ff;
    --accent-soft: #79c0ff;
    --accent-glow: rgba(88,166,255,0.15);
    --green: #3fb950;
    --danger: #F85149;
    --border: #30363d;
    --shadow-dark: #0a0e14;
    --shadow-light: #1c2333;
    --shadow-depth: 0 12px 40px rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    font-size: 14px;
    height: 100%;
    position: relative;
    background-image:
      radial-gradient(ellipse at 15% 15%, rgba(255,87,1,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 85%, rgba(255,87,1,0.03) 0%, transparent 50%);
  }
  [data-theme="dark"] body {
    background-image:
      radial-gradient(ellipse at 15% 15%, rgba(88,166,255,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 85%, rgba(88,166,255,0.03) 0%, transparent 50%);
  }
  .page-wrap {
    position: absolute;
    inset: 16px;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 16px;
  }

  /* ===== Floating Card Base ===== */
  .card {
    background: var(--surface-light);
    border-radius: var(--radius-md);
    box-shadow: 7px 7px 18px var(--shadow-dark), -7px -7px 18px var(--shadow-light), var(--shadow-depth);
  }

  /* ===== Top Bar ===== */
  .topbar {
    display: flex;
    align-items: center;
    padding: 16px 24px;
    gap: 12px;
    background: var(--surface-light);
    border-radius: var(--radius-md);
    position: relative;
    z-index: 10;
    box-shadow: 0 1px 3px var(--shadow-dark);
  }
  .topbar h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .topbar h1 span { color: var(--accent); }
  .topbar .topbar-meta { display: flex; flex-direction: column; align-items: flex-end; margin-right: 12px; line-height: 1.4; }
  .topbar .status { font-size: 11px; color: var(--text-tertiary); font-weight: 500; }
  .topbar .version { font-size: 10px; color: var(--text-tertiary); }
  .topbar .spacer { flex: 1; }

  /* ===== Body Area ===== */
  .body {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 12px;
    min-height: 0;
  }

  /* ===== Sidebar (floating card) ===== */
  .sidebar-w {
    border-radius: var(--radius-md);
    display: flex;
    background: var(--surface-light);
    box-shadow: 0 1px 3px var(--shadow-dark);
    min-height: 0;
  }
  .sidebar {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
    border-radius: var(--radius-md);
    background: var(--surface-light);
  }
  .sidebar > #sidebar {
    overflow-y: auto;
    flex: 1;
    padding: 4px 0;
  }
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--accent); opacity: 0.5; border-radius: 4px; }

  /* ===== Main Content (floating card, right panel) ===== */
  .main-w {
    border-radius: var(--radius-md);
    display: flex;
    background: var(--surface-light);
    box-shadow: 0 1px 3px var(--shadow-dark);
    min-height: 0;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-radius: var(--radius-md);
    background: var(--surface-light);
  }
  .main-inner {
    flex: 1;
    overflow: hidden auto;
    padding: 24px 28px 16px;
    border-radius: inherit;
  }
  .main-inner::-webkit-scrollbar { width: 4px; }
  .main-inner::-webkit-scrollbar-track { background: transparent; }
  .main-inner::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }


  /* ===== Neu inset (for search input) ===== */
  .neu-inset {
    display: flex;
    align-items: center;
    background: var(--surface);
    border-radius: var(--radius-sm);
    box-shadow: inset 2px 2px 6px var(--shadow-dark), inset -2px -2px 6px var(--shadow-light);
  }

  /* ===== Search ===== */
  .search-box { display: flex; gap: 6px; align-items: center; }
  .search-box input {
    width: 160px;
    height: 32px;
    padding: 0 14px;
    font-size: 12px;
    font-family: var(--font);
    color: var(--text-primary);
    background: transparent;
    border: none;
    outline: none;
  }
  .search-box input::placeholder { color: var(--text-tertiary); }
  .search-box button {
    height: 32px;
    padding: 0 16px;
    background: var(--surface);
    border: none;
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    box-shadow: 3px 3px 8px var(--shadow-dark), -3px -3px 8px var(--shadow-light);
    transition: box-shadow var(--transition), transform var(--transition);
  }
  .search-box button:hover { transform: translateY(-1px); }
  .search-box button:active {
    transform: scale(0.97);
    box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
  }

  /* ===== Theme Toggle ===== */
  .theme-btn {
    width: 32px; height: 32px;
    background: var(--surface);
    border: none;
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    box-shadow: 3px 3px 8px var(--shadow-dark), -3px -3px 8px var(--shadow-light);
    transition: box-shadow var(--transition), transform var(--transition), color var(--transition);
  }
  .theme-btn:hover { color: var(--accent); transform: translateY(-1px); }
  .theme-btn:active {
    transform: scale(0.97);
    box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
  }

  /* ===== Project Group ===== */
  .proj-group { border-bottom: 1px solid rgba(208,211,220,0.2); }
  [data-theme="dark"] .proj-group { border-bottom-color: rgba(48,54,61,0.3); }
  .proj-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
    margin: 4px 8px;
    border-radius: var(--radius-sm);
    transition: background var(--transition);
  }
  .proj-header:hover { background: var(--surface); }
  .proj-header.active {
    border-left: 2px solid var(--accent);
    background: var(--surface-light);
    box-shadow: 0 1px 3px var(--shadow-dark);
  }
  .proj-header .arrow {
    font-size: 10px;
    transition: transform 0.2s var(--ease-out);
  }
  .proj-header .arrow.open { transform: rotate(90deg); }

  /* ===== Session Item ===== */
  .session-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px 7px 32px;
    cursor: pointer;
    font-size: 13px;
    margin: 2px 8px;
    border-radius: var(--radius-sm);
    transition: background var(--transition);
  }
  .session-item:hover { background: var(--surface); }
  .session-item.active { background: var(--surface); box-shadow: inset 0 1px 3px var(--shadow-dark); }
  .session-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .date { font-size: 11px; color: var(--text-tertiary); white-space: nowrap; }
  .session-item .count {
    font-size: 10px;
    color: var(--text-tertiary);
    background: var(--surface);
    padding: 2px 8px;
    border-radius: 10px;
    box-shadow: inset 1px 1px 3px var(--shadow-dark), inset -1px -1px 3px var(--shadow-light);
  }

  /* ===== Delete Button ===== */
  .del-btn { font-size: 12px; cursor: pointer; opacity: 0; transition: opacity 0.15s; padding: 0 2px; user-select: none; }
  .proj-header:hover .del-btn, .session-item:hover .del-btn { opacity: 0.4; }
  .del-btn:hover { opacity: 1 !important; color: var(--danger); }

  /* ===== Empty / Loading States ===== */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-tertiary); }
  .empty h2 { font-size: 18px; margin-bottom: 6px; }
  .loading { text-align: center; padding: 40px; color: var(--text-tertiary); }

  /* ===== Records ===== */
  .record {
    padding: 14px 18px;
    margin-bottom: 8px;
    border-radius: var(--radius-md);
    background: var(--surface-light);
    font-size: 13px;
    box-shadow: 0 1px 3px var(--shadow-dark);
    position: relative;
    overflow: hidden;
  }
  .record::before {
  }
  .record::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    border-radius: 0 2px 2px 0;
  }
  .record.tool_use::before { background: #D97706; }
  .record.user_message::before { background: var(--accent); }
  .record.assistant_message::before { background: var(--green); }
  .record .meta { font-size: 11px; color: var(--text-tertiary); margin-bottom: 4px; padding-left: 4px; }
  .record .content { white-space: pre-wrap; word-break: break-word; padding-left: 4px; }

  /* ===== Main Header ===== */
  .main-header { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .main-meta {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(208,211,220,0.2);
  }
  [data-theme="dark"] .main-meta { border-bottom-color: rgba(48,54,61,0.3); }

  /* ===== Confirm Dialog ===== */
  .confirm-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(2px);
  }
  .confirm-overlay.show { display: flex; }
  .confirm-box {
    background: var(--surface-light);
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    max-width: 400px;
    box-shadow: 10px 10px 28px var(--shadow-dark), -10px -10px 28px var(--shadow-light), var(--shadow-depth);
  }
  .confirm-box p { margin-bottom: 20px; font-size: 14px; line-height: 1.6; }
  .confirm-box .btn-row { display: flex; gap: 10px; justify-content: flex-end; }
  .confirm-box button {
    padding: 8px 18px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    background: var(--surface);
    color: var(--text-primary);
    box-shadow: 3px 3px 8px var(--shadow-dark), -3px -3px 8px var(--shadow-light);
    transition: box-shadow var(--transition), transform var(--transition);
  }
  .confirm-box button:hover { transform: translateY(-1px); }
  .confirm-box button:active {
    transform: scale(0.97);
    box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
  }
  .confirm-box .btn-danger { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<div class="page-wrap">
<div class="topbar">
  <h1>🔍 <span>cc-trace</span></h1>
  <div class="spacer"></div>
  <div class="topbar-meta">
    <span class="status" id="status-text">—</span>
    <span class="version" id="version-text"></span>
  </div>
  <div class="search-box">
    <div class="neu-inset">
      <input id="search-input" placeholder="Search sessions..." onkeydown="if(event.key==='Enter')doSearch()">
    </div>
    <button onclick="doSearch()">Search</button>
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☽</button>
  </div>
</div>
<div class="body">
  <div class="sidebar-w">
    <div class="sidebar">
      <div id="sidebar"><div class="loading">Loading...</div></div>
    </div>
  </div>
  <div class="main-w">
    <div class="main"><div class="main-inner" id="main"><div class="empty"><h2>Select a session</h2></div></div></div>
  </div>
</div>
</div>
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p id="confirm-msg"></p>
    <div class="btn-row">
      <button onclick="closeConfirm()">Cancel</button>
      <button class="btn-danger" id="confirm-btn">Delete</button>
    </div>
  </div>
</div>
<script>
var API = '';
var data = []; var currentSid = null; var currentProj = null; var activeSessionId = null; var expandedSet = new Set();
var confirmCallback = null;

async function fetch_(path, opts) {
  var r = await fetch(API + path, opts || {});
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

async function updateStatus() {
  try {
    var s = await fetch_('/api/status');
    document.getElementById('status-text').textContent = s.sessionCount + ' sessions';
    if (s.version) document.getElementById('version-text').textContent = s.version;
  } catch {}
}

function findActiveProject() {
  if (!activeSessionId) return null;
  var bestProj = null;
  var bestDate = '';
  for (var g = 0; g < data.length; g++) {
    for (var s = 0; s < data[g].sessions.length; s++) {
      if (data[g].sessions[s].sessionId === activeSessionId && data[g].sessions[s].date > bestDate) {
        bestDate = data[g].sessions[s].date;
        bestProj = data[g].project;
      }
    }
  }
  return bestProj;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showConfirm(msg, dangerLabel, onConfirm) {
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-btn').textContent = dangerLabel || 'Delete';
  document.getElementById('confirm-overlay').classList.add('show');
  confirmCallback = onConfirm;
}
function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('show');
  confirmCallback = null;
}
document.getElementById('confirm-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeConfirm();
});
document.getElementById('confirm-btn').addEventListener('click', function() {
  var cb = confirmCallback;
  closeConfirm();
  if (cb) cb();
});

async function deleteSession(sid, proj) {
  try {
    await fetch_('/api/sessions/' + proj + '/' + sid, { method: 'DELETE' });
    data = await fetch_('/api/sessions');
    if (currentSid === sid && currentProj === proj) {
      currentSid = null; currentProj = null;
      document.getElementById('main').innerHTML = '<div class="empty"><h2>Select a session</h2></div>';
    }
    renderSidebar();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="empty"><h2>Delete failed: ' + esc(e.message) + '</h2></div>';
  }
}

async function deleteProject(proj) {
  try {
    await fetch_('/api/sessions/' + proj, { method: 'DELETE' });
    data = await fetch_('/api/sessions');
    if (currentProj === proj) {
      currentSid = null; currentProj = null;
      document.getElementById('main').innerHTML = '<div class="empty"><h2>Select a session</h2></div>';
    }
    renderSidebar();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="empty"><h2>Delete failed: ' + esc(e.message) + '</h2></div>';
  }
}

function renderSidebar() {
  var sb = document.getElementById('sidebar');
  var activeProj = findActiveProject();
  var html = '', projIdx = 0;

  for (var g = 0; g < data.length; g++) {
    var group = data[g];
    var projName = group.project || 'default';
    var gid = 'p' + (projIdx++);

    var sessionMap = {};
    for (var si = 0; si < group.sessions.length; si++) {
      var s = group.sessions[si];
      var sid = s.sessionId;
      if (!sessionMap[sid]) {
        sessionMap[sid] = { sessionId: sid, title: s.title || sid.slice(0, 20), dates: [], totalRecords: 0, workspace: s.workspace, _latestDate: '' };
      }
      sessionMap[sid].dates.push(s.date);
      sessionMap[sid].totalRecords += s.recordCount;
      if (s.date > sessionMap[sid]._latestDate) {
        sessionMap[sid].title = s.title || sid.slice(0, 20);
        sessionMap[sid]._latestDate = s.date;
      }
    }

    var sessions = Object.values(sessionMap).sort(function(a, b) {
      return Math.max.apply(null, b.dates.map(Number)) - Math.max.apply(null, a.dates.map(Number));
    });

    if (sessions.length === 0) continue;

    var isOpen = expandedSet.has(gid);
    var projActive = (projName === activeProj);
    html += '<div class="proj-group" data-gid="' + gid + '">';
    html += '<div class="proj-header' + (projActive ? ' active' : '') + '" onclick="toggleProj(\'' + gid + '\')">';
    html += '<span class="arrow ' + (isOpen ? 'open' : '') + '">&#9654;</span> ';
    html += esc(projName);
    html += ' <span style="margin-left:auto;font-weight:400;color:var(--text-tertiary);font-size:11px">' + sessions.length + '</span>';
    html += ' <span class="del-btn" onclick="event.stopPropagation();showConfirm(\'Delete entire project «' + esc(projName) + '» and all its sessions? This cannot be undone.\',\'Delete Project\',function(){deleteProject(\'' + esc(projName) + '\')})">&#x1F5D1;</span>';
    html += '</div>';
    html += '<div class="proj-sessions" id="proj-' + gid + '" style="display:' + (isOpen ? 'block' : 'none') + '">';

    for (var si = 0; si < sessions.length; si++) {
      var sess = sessions[si];
      var sorted = sess.dates.slice().sort();
      var range = sorted.length === 1 ? sorted[0].slice(4) : sorted[0].slice(4) + ' ~ ' + sorted[sorted.length - 1].slice(4);
      var isActive = sess.sessionId === activeSessionId && projName === activeProj;
      var isSelected = sess.sessionId === currentSid && projName === currentProj;
      var dot = isActive ? '<span style="color:var(--green)">&#x1F7E2;</span> ' : '';

      html += '<div class="session-item' + (isSelected ? ' active' : '') + '" onclick="selectSession(this)" data-sid="' + sess.sessionId + '" data-proj="' + esc(projName) + '">';
      html += '<span class="title">' + dot + esc(sess.title || sess.sessionId.slice(0, 20)) + '</span>';
      html += '<span class="date">' + range + '</span>';
      html += '<span class="count">' + sess.totalRecords + '</span>';
      html += ' <span class="del-btn" onclick="event.stopPropagation();showConfirm(\'Delete session «' + esc(sess.title || sess.sessionId.slice(0, 20)) + '» in ' + esc(projName) + '? This cannot be undone.\',\'Delete\',function(){deleteSession(\'' + sess.sessionId + '\',\'' + esc(projName) + '\')})">&#x1F5D1;</span>';
      html += '</div>';
    }

    html += '</div></div>';
  }

  sb.innerHTML = html || '<div class="empty" style="padding:30px"><h2>No sessions</h2></div>';
}

function toggleProj(id) {
  var el = document.getElementById('proj-' + id);
  if (!el) return;
  if (el.style.display === 'block') {
    el.style.display = 'none';
    var arrow = el.parentElement.querySelector('.arrow');
    if (arrow) arrow.classList.remove('open');
    expandedSet.delete(id);
  } else {
    el.style.display = 'block';
    var arrow = el.parentElement.querySelector('.arrow');
    if (arrow) arrow.classList.add('open');
    expandedSet.add(id);
  }
}

async function selectSession(el) {
  var sid = el.dataset.sid;
  var proj = el.dataset.proj;
  currentSid = sid;
  currentProj = proj;
  renderSidebar();
  document.getElementById('main').innerHTML = '<div class="loading">Loading records...</div>';
  try {
    var d = await fetch_('/api/sessions/' + proj + '/' + sid);
    renderRecords(d);
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="empty"><h2>Error</h2><p>' + e.message + '</p></div>';
  }
}

const TOOL_COLORS = {
  Bash: '#D97706', Read: '#FF5701', Write: '#16A34A', Edit: '#16A34A',
  WebSearch: '#A855F7', WebFetch: '#A855F7', Grep: '#F97316', Glob: '#F97316',
  default: '#8B949E'
};

function renderRecords(d) {
  var main = document.getElementById('main');
  if (!d || !d.records || d.records.length === 0) { main.innerHTML = '<div class="empty"><h2>No records</h2></div>'; return; }
  var title = (d.records.find(function(r) { return r.type === 'user_message'; })?.content || d.sessionId).slice(0, 60).replace(/\n/g, ' ');
  var html = '<div class="main-header">' + esc(title) + '</div><div class="main-meta">' + d.total + ' records</div>';

  var i = 0;
  while (i < d.records.length) {
    var r = d.records[i];
    var type = r.type || 'unknown';
    var time = r.ts ? new Date(r.ts).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '';

    if (type === 'tool_use') {
      var group = [];
      while (i < d.records.length && d.records[i].type === 'tool_use') { group.push(d.records[i]); i++; }
      var counts = {};
      var names = [];
      for (var ti = 0; ti < group.length; ti++) {
        var n = group[ti].toolName || 'unknown';
        if (!counts[n]) { counts[n] = 0; names.push(n); }
        counts[n]++;
      }
      var tools = names.map(function(n) {
        var c = TOOL_COLORS[n] || TOOL_COLORS.default;
        var label = counts[n] > 1 ? n + '(' + counts[n] + ')' : n;
        return '<span style="color:' + c + ';font-weight:600">' + label + '</span>';
      });
      var grpTime = group[0].ts ? new Date(group[0].ts).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '';
      html += '<div class="record tool_use"><div class="meta">' + grpTime + ' · ' + tools.join(' ') + '</div></div>';
    } else {
      html += '<div class="record ' + type + '"><div class="meta">' + time + ' · ' + type;
      if (r.toolName) {
        var c = TOOL_COLORS[r.toolName] || TOOL_COLORS.default;
        html += ' · <span style="color:' + c + ';font-weight:600">' + esc(r.toolName) + '</span>';
      }
      html += '</div>';
      if (r.content) html += '<div class="content">' + esc(r.content.slice(0,2000)) + '</div>';
      html += '</div>';
      i++;
    }
  }
  main.innerHTML = html;
}

async function doSearch() {
  var q = document.getElementById('search-input').value.trim();
  if (!q) return;
  document.getElementById('main').innerHTML = '<div class="loading">Searching...</div>';
  try {
    var r = await fetch_('/api/search?q=' + encodeURIComponent(q));
    var items = r.keyword || r.ai_fallback || [];
    if (!items || items.length === 0) { document.getElementById('main').innerHTML = '<div class="empty"><h2>No results</h2></div>'; return; }
    var html = '<div class="main-header">Results</div><div class="main-meta">' + items.length + ' matches</div>';
    for (var ii = 0; ii < items.length; ii++) {
      var content = items[ii].record?.content || items[ii].content || '';
      html += '<div class="record"><div class="meta">[' + (items[ii].date || '?') + ']</div><div class="content">' + esc(String(content).slice(0,500)) + '</div></div>';
    }
    document.getElementById('main').innerHTML = html;
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="empty"><h2>Search failed</h2></div>';
  }
}

async function fetchActiveSession() {
  try {
    var r = await fetch_('/api/current-session');
    if (r.sessionId) activeSessionId = r.sessionId;
  } catch {}
}

function toggleTheme() {
  var isDark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', isDark ? '' : 'dark');
  document.getElementById('theme-btn').textContent = isDark ? '☽' : '☀';
  try { localStorage.setItem('cc-trace-theme', isDark ? 'light' : 'dark'); } catch {}
}
try {
  var saved = localStorage.getItem('cc-trace-theme');
  if (saved === 'dark') { document.body.setAttribute('data-theme', 'dark'); document.getElementById('theme-btn').textContent = '☀'; }
} catch {}

updateStatus();
setInterval(updateStatus, 10000);
fetchActiveSession();
setInterval(fetchActiveSession, 5000);
loadSessions();
async function loadSessions() {
  try {
    data = await fetch_('/api/sessions');
    renderSidebar();
  } catch (e) {
    document.getElementById('sidebar').innerHTML = '<div class="empty"><h2>Error</h2><p>' + e.message + '</p></div>';
  }
}
</script>
