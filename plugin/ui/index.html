<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cc-trace</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --orange: #d29922; --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    height: 100vh; display: flex; flex-direction: column;
  }
  /* ── Top Bar ── */
  .topbar {
    display: flex; align-items: center; padding: 10px 20px;
    background: var(--surface); border-bottom: 1px solid var(--border); gap: 12px;
  }
  .topbar h1 { font-size: 16px; font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .topbar select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .topbar select:focus { outline: none; border-color: var(--accent); }
  /* ── Breadcrumb ── */
  .breadcrumb {
    display: flex; align-items: center; gap: 6px; padding: 6px 20px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--text-dim);
  }
  .breadcrumb span { cursor: pointer; }
  .breadcrumb span:hover { color: var(--accent); }
  .breadcrumb .sep { color: var(--border); }
  .breadcrumb .current { color: var(--text); }
  /* ── Body ── */
  .body { display: flex; flex: 1; overflow: hidden; }
  /* ── Sidebar ── */
  .sidebar {
    width: 340px; min-width: 340px; background: var(--surface);
    border-right: 1px solid var(--border); overflow-y: auto;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .date-group { border-bottom: 1px solid var(--border); }
  .date-header {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px;
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    cursor: pointer; user-select: none; letter-spacing: 0.3px;
  }
  .date-header:hover { background: rgba(255,255,255,0.03); }
  .date-header .arrow { font-size: 10px; transition: transform 0.15s; }
  .date-header .arrow.open { transform: rotate(90deg); }
  .session-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 28px;
    cursor: pointer; border-left: 2px solid transparent; font-size: 13px;
  }
  .session-item:hover { background: rgba(255,255,255,0.04); }
  .session-item.active {
    background: rgba(88,166,255,0.1); border-left-color: var(--accent);
  }
  .session-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .count {
    font-size: 11px; color: var(--text-dim); background: rgba(255,255,255,0.05);
    padding: 1px 6px; border-radius: 8px;
  }
  /* ── Main Content ── */
  .main { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .main-header { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .main-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
  /* ── Records ── */
  .record {
    padding: 10px 14px; margin-bottom: 6px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface); font-size: 13px;
    line-height: 1.6;
  }
  .record.tool_use { border-left: 3px solid var(--orange); }
  .record.user_message { border-left: 3px solid var(--accent); }
  .record.assistant_message { border-left: 3px solid var(--green); }
  .record .meta { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
  .record .tool-name { color: var(--orange); font-weight: 600; }
  .record .content { white-space: pre-wrap; word-break: break-word; }
  /* ── Empty State ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty h2 { font-size: 18px; margin-bottom: 6px; }
  .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  /* ── Search ── */
  .search-bar {
    display: flex; gap: 6px; padding: 6px 20px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .search-bar input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 5px 10px; border-radius: 6px; font-size: 13px;
  }
  .search-bar input:focus { outline: none; border-color: var(--accent); }
  .search-bar button {
    background: var(--accent); color: #fff; border: none;
    padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .search-bar button:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="topbar">
  <h1>🔍 cc-trace</h1>
  <div class="spacer"></div>
  <span id="status" style="font-size:12px;color:var(--text-dim)">—</span>
  <select id="project-select" style="display:none"></select>
</div>
<div class="search-bar">
  <input id="search-input" placeholder="Search past conversations..." onkeydown="if(event.key==='Enter')doSearch()">
  <button onclick="doSearch()">Search</button>
</div>
<div class="breadcrumb" id="breadcrumb">
  <span onclick="selectDate(null)">Sessions</span>
</div>
<div class="body">
  <div class="sidebar" id="sidebar"><div class="loading">Loading...</div></div>
  <div class="main" id="main"><div class="empty"><h2>Select a session</h2></div></div>
</div>
<script>
const API = '';
let data = []; let currentSid = null; let currentDate = null;

async function fetch_(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

// ── Status ──
async function updateStatus() {
  try {
    const s = await fetch_('/api/status');
    document.getElementById('status').textContent = `${s.sessionCount} sessions · ${s.memoryCount} memories`;
  } catch {}
}

// ── Load Sessions ──
async function loadSessions() {
  document.getElementById('sidebar').innerHTML = '<div class="loading">Loading...</div>';
  try {
    data = await fetch_('/api/sessions');
    renderSidebar();
  } catch (e) {
    document.getElementById('sidebar').innerHTML = `<div class="empty"><h2>Error</h2><p>${e.message}</p></div>`;
  }
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  if (!data || data.length === 0) {
    sidebar.innerHTML = '<div class="empty" style="padding:30px"><h2>No sessions</h2><p>Start a conversation to record</p></div>';
    return;
  }
  // Also populate project dropdown
  const sel = document.getElementById('project-select');
  sel.style.display = 'block';
  // Build HTML
  let html = '';
  for (const group of data) {
    const isOpen = !currentDate || group.date === currentDate;
    html += `<div class="date-group">
      <div class="date-header" onclick="toggleDate('${group.date}')">
        <span class="arrow ${isOpen?'open':''}">▶</span> ${group.date} <span style="margin-left:auto;font-weight:400">${group.sessions.length}</span>
      </div>
      <div class="date-sessions" id="date-${group.date}" style="display:${isOpen?'block':'none'}">`;
    for (const s of group.sessions) {
      const active = currentSid === s.sessionId;
      const title = s.title || s.sessionId.slice(0, 16);
      html += `<div class="session-item ${active?'active':''}" onclick="selectSession('${group.date}','${s.sessionId}')" data-date="${group.date}" data-sid="${s.sessionId}">
        <span class="title">${escape(title)}</span>
        <span class="count">${s.recordCount}</span>
      </div>`;
    }
    html += `</div></div>`;
  }
  sidebar.innerHTML = html;
  updateBreadcrumb();
}

function toggleDate(date) {
  const el = document.getElementById('date-' + date);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  const arrow = el.parentElement.querySelector('.arrow');
  if (arrow) arrow.classList.toggle('open');
}

function selectDate(date) {
  currentDate = date;
  currentSid = null;
  document.getElementById('main').innerHTML = '<div class="empty"><h2>Select a session</h2></div>';
  renderSidebar();
}

async function selectSession(date, sid) {
  currentDate = date;
  currentSid = sid;
  renderSidebar();
  document.getElementById('main').innerHTML = '<div class="loading">Loading records...</div>';
  try {
    const d = await fetch_(`/api/sessions/${date}/${sid}`);
    renderRecords(d);
  } catch (e) {
    document.getElementById('main').innerHTML = `<div class="empty"><h2>Error</h2><p>${e.message}</p></div>`;
  }
}

function renderRecords(d) {
  const main = document.getElementById('main');
  if (!d || !d.records || d.records.length === 0) {
    main.innerHTML = '<div class="empty"><h2>No records</h2></div>';
    return;
  }
  const title = d.records.find(r => r.type === 'user_message')?.content?.slice(0, 60)?.replace(/\n/g,' ') || d.sessionId;
  let html = `<div class="main-header">${escape(title)}</div>
    <div class="main-meta">${d.total} records</div>`;
  for (const r of d.records) {
    const type = r.type || 'unknown';
    const time = r.ts ? new Date(r.ts).toLocaleTimeString() : '';
    html += `<div class="record ${type}">`;
    html += `<div class="meta">${time} · ${type}`;
    if (r.toolName) html += ` · <span class="tool-name">${escape(r.toolName)}</span>`;
    html += '</div>';
    if (r.content) html += `<div class="content">${escape(r.content.slice(0, 2000))}</div>`;
    if (r.toolInput) html += `<div class="content" style="color:var(--text-dim);font-size:12px">Input: ${escape(r.toolInput.slice(0, 300))}</div>`;
    html += '</div>';
  }
  main.innerHTML = html;
  updateBreadcrumb();
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  let html = '<span onclick="selectDate(null)">Sessions</span>';
  if (currentDate) {
    html += `<span class="sep"> › </span><span onclick="selectDate('${currentDate}')">${currentDate}</span>`;
  }
  if (currentSid) {
    const title = currentSid.slice(0, 16);
    html += `<span class="sep"> › </span><span class="current">${escape(title)}</span>`;
  }
  bc.innerHTML = html;
}

// ── Search ──
async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  document.getElementById('main').innerHTML = '<div class="loading">Searching...</div>';
  try {
    const r = await fetch_(`/api/search?q=${encodeURIComponent(q)}`);
    const items = r.keyword || r.ai_fallback || [];
    if (!items || items.length === 0) {
      document.getElementById('main').innerHTML = `<div class="empty"><h2>No results for "${escape(q)}"</h2></div>`;
      return;
    }
    let html = `<div class="main-header">Results: "${escape(q)}"</div><div class="main-meta">${items.length} matches</div>`;
    for (const item of items) {
      const sid = item.sessionId || '?';
      const date = item.date || '?';
      const content = item.record?.content || item.content || '';
      html += `<div class="record">
        <div class="meta">[${date}/${sid.slice(0,12)}]</div>
        <div class="content">${escape(String(content).slice(0,500))}</div>
      </div>`;
    }
    document.getElementById('main').innerHTML = html;
  } catch (e) {
    document.getElementById('main').innerHTML = `<div class="empty"><h2>Search failed</h2><p>${e.message}</p></div>`;
  }
}

function escape(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Init ──
updateStatus(); setInterval(updateStatus, 10000);
loadSessions();
</script>
</body>
</html>
