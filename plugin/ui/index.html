<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cc-trace</title>
<style>
  :root { --bg: #F6F6F1; --surface: #FFFFFF; --border: #E5E5E0; --text: #111827; --text-dim: #6B7280; --accent: #FF5701; --green: #16A34A; --danger: #DC2626; --hover: #F3F3EE; --active-bg: #FFF0E8; --badge-bg: #F0F0EB; --shadow: rgba(0,0,0,0.04); --search-bg: #FFFFFF; --toolbar-bg: #FFFFFF; --overlay: rgba(0,0,0,0.4); }
  [data-theme="dark"] { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --text-dim: #8b949e; --accent: #58a6ff; --green: #3fb950; --danger: #F85149; --hover: rgba(255,255,255,0.04); --active-bg: rgba(88,166,255,0.1); --badge-bg: rgba(255,255,255,0.05); --shadow: rgba(0,0,0,0.2); --search-bg: #0d1117; --toolbar-bg: #161b22; --overlay: rgba(0,0,0,0.6); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 12px; }
  .topbar h1 { font-size: 16px; font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .body { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 340px; min-width: 340px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .main { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .bottombar { display: flex; align-items: center; padding: 4px 20px; background: var(--surface); border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); }
  .proj-group { border-bottom: 1px solid var(--border); }
  .proj-header { display: flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer; user-select: none; border-left: 2px solid transparent; }
  .proj-header:hover { background: var(--hover); }
  .proj-header.active { border-left-color: var(--accent); background: var(--active-bg); }
  .proj-header .arrow { font-size: 10px; transition: transform 0.15s; }
  .proj-header .arrow.open { transform: rotate(90deg); }
  .session-item { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 28px; cursor: pointer; border-left: 2px solid transparent; font-size: 13px; }
  .session-item:hover { background: var(--hover); }
  .session-item.active { background: var(--active-bg); border-left-color: var(--accent); }
  .session-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .date { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .session-item .count { font-size: 11px; color: var(--text-dim); background: var(--badge-bg); padding: 1px 6px; border-radius: 8px; }
  .del-btn { font-size: 12px; cursor: pointer; opacity: 0; transition: opacity 0.1s; padding: 0 2px; user-select: none; }
  .proj-header:hover .del-btn, .session-item:hover .del-btn { opacity: 0.5; }
  .del-btn:hover { opacity: 1 !important; color: var(--danger); }
  .search-box { display: flex; gap: 4px; align-items: center; }
  .search-box input { width: 120px; height: 28px; background: var(--search-bg); border: 1px solid var(--border); color: var(--text); padding: 0 8px; border-radius: 4px; font-size: 12px; box-sizing: border-box; }
  .search-box input:focus { outline: none; border-color: var(--accent); }
  .search-box button { background: var(--accent); color: #fff; border: none; height: 28px; padding: 0 10px; border-radius: 4px; cursor: pointer; font-size: 12px; box-sizing: border-box; }
  .theme-btn { background: transparent; border: 1px solid var(--border); color: var(--text-dim); height: 28px; width: 30px; padding: 0; border-radius: 4px; cursor: pointer; font-size: 14px; line-height: 28px; text-align: center; box-sizing: border-box; }
  .theme-btn:hover { color: var(--accent); border-color: var(--accent); }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty h2 { font-size: 18px; margin-bottom: 6px; }
  .loading { text-align: center; padding: 40px; color: var(--text-dim); }
  .record { padding: 10px 14px; margin-bottom: 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; box-shadow: 0 1px 2px var(--shadow); }
  .record.tool_use { border-left: 3px solid #D97706; }
  .record.user_message { border-left: 3px solid var(--accent); }
  .record.assistant_message { border-left: 3px solid var(--green); }
  .record .meta { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
  .record .content { white-space: pre-wrap; word-break: break-word; }
  .main-header { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .main-meta { font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
  /* Confirm dialog */
  .confirm-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay); z-index: 1000; justify-content: center; align-items: center; }
  .confirm-overlay.show { display: flex; }
  .confirm-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px 24px; max-width: 400px; box-shadow: 0 8px 32px var(--shadow); }
  .confirm-box p { margin-bottom: 16px; font-size: 14px; line-height: 1.5; }
  .confirm-box .btn-row { display: flex; gap: 8px; justify-content: flex-end; }
  .confirm-box button { padding: 6px 16px; border-radius: 4px; border: 1px solid var(--border); font-size: 13px; cursor: pointer; background: var(--surface); color: var(--text); }
  .confirm-box button:hover { background: var(--hover); }
  .confirm-box .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .confirm-box .btn-danger:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="topbar">
  <h1>🔍 cc-trace</h1>
  <div class="spacer"></div>
  <div class="search-box">
    <input id="search-input" placeholder="Search..." onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">Go</button>
    <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">☽</button>
  </div>
</div>
<div class="body">
  <div class="sidebar">
    <div id="sidebar" style="overflow-y:auto;flex:1"><div class="loading">Loading...</div></div>
  </div>
  <div class="main" id="main"><div class="empty"><h2>Select a session</h2></div></div>
</div>
<div class="bottombar">
  <span id="status">—</span>
  <span style="margin-left:auto;font-size:11px;color:var(--text-dim)" id="version"></span>
</div>
<!-- Confirm dialog -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p id="confirm-msg"></p>
    <div class="btn-row">
      <button onclick="closeConfirm()">Cancel</button>
      <button class="btn-danger" id="confirm-btn">Delete</button>
    </div>
  </div>
</div>
<script>
var API = '';
var data = []; var currentSid = null; var currentProj = null; var activeSessionId = null; var expandedSet = new Set();
var confirmCallback = null;

async function fetch_(path, opts) {
  var r = await fetch(API + path, opts || {});
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

async function updateStatus() {
  try {
    var s = await fetch_('/api/status');
    document.getElementById('status').innerHTML = '<span style="color:var(--accent);font-weight:600">cc-trace</span> ' + s.sessionCount + ' sessions · ' + s.memoryCount + ' memories';
    if (s.version) document.getElementById('version').textContent = s.version;
  } catch {}
}

/** Find which project has the most recent record for the active session */
function findActiveProject() {
  if (!activeSessionId) return null;
  var bestProj = null;
  var bestDate = '';
  for (var g = 0; g < data.length; g++) {
    for (var s = 0; s < data[g].sessions.length; s++) {
      if (data[g].sessions[s].sessionId === activeSessionId && data[g].sessions[s].date > bestDate) {
        bestDate = data[g].sessions[s].date;
        bestProj = data[g].project;
      }
    }
  }
  return bestProj;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Confirm dialog ── */
function showConfirm(msg, dangerLabel, onConfirm) {
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-btn').textContent = dangerLabel || 'Delete';
  document.getElementById('confirm-overlay').classList.add('show');
  confirmCallback = onConfirm;
}
function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('show');
  confirmCallback = null;
}
document.getElementById('confirm-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeConfirm();
});
document.getElementById('confirm-btn').addEventListener('click', function() {
  var cb = confirmCallback;
  closeConfirm();
  if (cb) cb();
});

/* ── Delete actions ── */
async function deleteSession(sid, proj) {
  try {
    await fetch_('/api/sessions/' + proj + '/' + sid, { method: 'DELETE' });
    // Reload sidebar
    data = await fetch_('/api/sessions');
    if (currentSid === sid && currentProj === proj) {
      currentSid = null; currentProj = null;
      document.getElementById('main').innerHTML = '<div class="empty"><h2>Select a session</h2></div>';
    }
    renderSidebar();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="empty"><h2>Delete failed: ' + esc(e.message) + '</h2></div>';
  }
}

async function deleteProject(proj) {
  try {
    await fetch_('/api/sessions/' + proj, { method: 'DELETE' });
    data = await fetch_('/api/sessions');
    if (currentProj === proj) {
      currentSid = null; currentProj = null;
      document.getElementById('main').innerHTML = '<div class="empty"><h2>Select a session</h2></div>';
    }
    renderSidebar();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="empty"><h2>Delete failed: ' + esc(e.message) + '</h2></div>';
  }
}

function renderSidebar() {
  var sb = document.getElementById('sidebar');
  var activeProj = findActiveProject();
  var html = '', projIdx = 0;

  for (var g = 0; g < data.length; g++) {
    var group = data[g];
    var projName = group.project || 'default';
    var gid = 'p' + (projIdx++);

    // Group sessions by sessionId within this project
    var sessionMap = {};
    for (var si = 0; si < group.sessions.length; si++) {
      var s = group.sessions[si];
      var sid = s.sessionId;
      if (!sessionMap[sid]) {
        sessionMap[sid] = { sessionId: sid, title: s.title || sid.slice(0, 20), dates: [], totalRecords: 0, workspace: s.workspace, _latestDate: '' };
      }
      sessionMap[sid].dates.push(s.date);
      sessionMap[sid].totalRecords += s.recordCount;
      if (s.date > sessionMap[sid]._latestDate) {
        sessionMap[sid].title = s.title || sid.slice(0, 20);
        sessionMap[sid]._latestDate = s.date;
      }
    }

    var sessions = Object.values(sessionMap).sort(function(a, b) {
      return Math.max.apply(null, b.dates.map(Number)) - Math.max.apply(null, a.dates.map(Number));
    });

    if (sessions.length === 0) continue;

    var isOpen = expandedSet.has(gid);
    var projActive = (projName === activeProj);
    html += '<div class="proj-group" data-gid="' + gid + '">';
    html += '<div class="proj-header' + (projActive ? ' active' : '') + '" onclick="toggleProj(\'' + gid + '\')">';
    html += '<span class="arrow ' + (isOpen ? 'open' : '') + '">&#9654;</span> ';
    html += esc(projName);
    html += ' <span style="margin-left:auto;font-weight:400">' + sessions.length + '</span>';
    html += ' <span class="del-btn" onclick="event.stopPropagation();showConfirm(\'Delete entire project «' + esc(projName) + '» and all its sessions? This cannot be undone.\',\'Delete Project\',function(){deleteProject(\'' + esc(projName) + '\')})">&#x1F5D1;</span>';
    html += '</div>';
    html += '<div class="proj-sessions" id="proj-' + gid + '" style="display:' + (isOpen ? 'block' : 'none') + '">';

    for (var si = 0; si < sessions.length; si++) {
      var sess = sessions[si];
      var sorted = sess.dates.slice().sort();
      var range = sorted.length === 1 ? sorted[0].slice(4) : sorted[0].slice(4) + ' ~ ' + sorted[sorted.length - 1].slice(4);
      var isActive = sess.sessionId === activeSessionId && projName === activeProj;
      var isSelected = sess.sessionId === currentSid && projName === currentProj;
      var dot = isActive ? '<span style="color:var(--green)">&#x1F7E2;</span> ' : '';

      html += '<div class="session-item' + (isSelected ? ' active' : '') + '" onclick="selectSession(this)" data-sid="' + sess.sessionId + '" data-proj="' + esc(projName) + '">';
      html += '<span class="title">' + dot + esc(sess.title || sess.sessionId.slice(0, 20)) + '</span>';
      html += '<span class="date">' + range + '</span>';
      html += '<span class="count">' + sess.totalRecords + '</span>';
      html += ' <span class="del-btn" onclick="event.stopPropagation();showConfirm(\'Delete session «' + esc(sess.title || sess.sessionId.slice(0, 20)) + '» in ' + esc(projName) + '? This cannot be undone.\',\'Delete\',function(){deleteSession(\'' + sess.sessionId + '\',\'' + esc(projName) + '\')})">&#x1F5D1;</span>';
      html += '</div>';
    }

    html += '</div></div>';
  }

  sb.innerHTML = html || '<div class="empty" style="padding:30px"><h2>No sessions</h2></div>';
}

function toggleProj(id) {
  var el = document.getElementById('proj-' + id);
  if (!el) return;
  if (el.style.display === 'block') {
    el.style.display = 'none';
    var arrow = el.parentElement.querySelector('.arrow');
    if (arrow) arrow.classList.remove('open');
    expandedSet.delete(id);
  } else {
    el.style.display = 'block';
    var arrow = el.parentElement.querySelector('.arrow');
    if (arrow) arrow.classList.add('open');
    expandedSet.add(id);
  }
}

async function selectSession(el) {
  var sid = el.dataset.sid;
  var proj = el.dataset.proj;
  currentSid = sid;
  currentProj = proj;
  renderSidebar();
  document.getElementById('main').innerHTML = '<div class="loading">Loading records...</div>';
  try {
    var d = await fetch_('/api/sessions/' + proj + '/' + sid);
    renderRecords(d);
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="empty"><h2>Error</h2><p>' + e.message + '</p></div>';
  }
}

const TOOL_COLORS = {
  Bash: '#D97706', Read: '#FF5701', Write: '#16A34A', Edit: '#16A34A',
  WebSearch: '#A855F7', WebFetch: '#A855F7', Grep: '#F97316', Glob: '#F97316',
  default: '#8B949E'
};

function renderRecords(d) {
  var main = document.getElementById('main');
  if (!d || !d.records || d.records.length === 0) { main.innerHTML = '<div class="empty"><h2>No records</h2></div>'; return; }
  var title = (d.records.find(function(r) { return r.type === 'user_message'; })?.content || d.sessionId).slice(0, 60).replace(/\n/g, ' ');
  var html = '<div class="main-header">' + esc(title) + '</div><div class="main-meta">' + d.total + ' records</div>';

  var i = 0;
  while (i < d.records.length) {
    var r = d.records[i];
    var type = r.type || 'unknown';
    var time = r.ts ? new Date(r.ts).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '';

    if (type === 'tool_use') {
      var group = [];
      while (i < d.records.length && d.records[i].type === 'tool_use') { group.push(d.records[i]); i++; }
      var counts = {};
      var names = [];
      for (var ti = 0; ti < group.length; ti++) {
        var n = group[ti].toolName || 'unknown';
        if (!counts[n]) { counts[n] = 0; names.push(n); }
        counts[n]++;
      }
      var tools = names.map(function(n) {
        var c = TOOL_COLORS[n] || TOOL_COLORS.default;
        var label = counts[n] > 1 ? n + '(' + counts[n] + ')' : n;
        return '<span style="color:' + c + ';font-weight:600">' + label + '</span>';
      });
      var grpTime = group[0].ts ? new Date(group[0].ts).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) : '';
      html += '<div class="record tool_use"><div class="meta">' + grpTime + ' · ' + tools.join(' ') + '</div></div>';
    } else {
      html += '<div class="record ' + type + '"><div class="meta">' + time + ' · ' + type;
      if (r.toolName) {
        var c = TOOL_COLORS[r.toolName] || TOOL_COLORS.default;
        html += ' · <span style="color:' + c + ';font-weight:600">' + esc(r.toolName) + '</span>';
      }
      html += '</div>';
      if (r.content) html += '<div class="content">' + esc(r.content.slice(0,2000)) + '</div>';
      html += '</div>';
      i++;
    }
  }
  main.innerHTML = html;
}

async function doSearch() {
  var q = document.getElementById('search-input').value.trim();
  if (!q) return;
  document.getElementById('main').innerHTML = '<div class="loading">Searching...</div>';
  try {
    var r = await fetch_('/api/search?q=' + encodeURIComponent(q));
    var items = r.keyword || r.ai_fallback || [];
    if (!items || items.length === 0) { document.getElementById('main').innerHTML = '<div class="empty"><h2>No results</h2></div>'; return; }
    var html = '<div class="main-header">Results</div><div class="main-meta">' + items.length + ' matches</div>';
    for (var ii = 0; ii < items.length; ii++) {
      var content = items[ii].record?.content || items[ii].content || '';
      html += '<div class="record"><div class="meta">[' + (items[ii].date || '?') + ']</div><div class="content">' + esc(String(content).slice(0,500)) + '</div></div>';
    }
    document.getElementById('main').innerHTML = html;
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="empty"><h2>Search failed</h2></div>';
  }
}

async function fetchActiveSession() {
  try {
    var r = await fetch_('/api/current-session');
    if (r.sessionId) activeSessionId = r.sessionId;
  } catch {}
}

function toggleTheme() {
  var isDark = document.body.getAttribute('data-theme') === 'dark';
  document.body.setAttribute('data-theme', isDark ? '' : 'dark');
  document.getElementById('theme-btn').textContent = isDark ? '☽' : '☀';
  try { localStorage.setItem('cc-trace-theme', isDark ? 'light' : 'dark'); } catch {}
}
try {
  var saved = localStorage.getItem('cc-trace-theme');
  if (saved === 'dark') { document.body.setAttribute('data-theme', 'dark'); document.getElementById('theme-btn').textContent = '☀'; }
} catch {}

updateStatus();
setInterval(updateStatus, 10000);
fetchActiveSession();
setInterval(fetchActiveSession, 5000);
loadSessions();
async function loadSessions() {
  try {
    data = await fetch_('/api/sessions');
    renderSidebar();
  } catch (e) {
    document.getElementById('sidebar').innerHTML = '<div class="empty"><h2>Error</h2><p>' + e.message + '</p></div>';
  }
}
</script>
</body>
</html>
